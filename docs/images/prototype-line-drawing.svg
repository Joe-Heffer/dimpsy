  <line x1="248" y1="262" x2="220" y2="262" stroke="#888780" stroke-width="2.5"/>
  <line x1="300" y1="266" x2="266" y2="266" stroke="#888780" stroke-width="2"/>
  <rect x="300" y="252" width="50" height="28" rx="4" class="o"/>

