      .ts { font-size: 12px; fill: #444441; }
      .o { fill: #F1EFE8; stroke: #2C2C2A; stroke-width: 1; }
      .leader { stroke: #888780; stroke-width: 0.5; stroke-dasharray: 3 2; fill: none; }
    </style>
  </defs>
  <rect width="380" height="392" fill="#FFFFFF"/>

  <circle cx="280" cy="130" r="75" fill="#FAC775" fill-opacity="0.22" stroke="#2C2C2A" stroke-width="1"/>
  <rect x="270" y="140" width="20" height="64" rx="2" fill="#B4B2A9" stroke="#2C2C2A" stroke-width="0.8"/>
  <g stroke="#EF9F27" stroke-width="3" stroke-linecap="round">
    <line x1="271" y1="150" x2="289" y2="144"/>
    <line x1="271" y1="159" x2="289" y2="153"/>
    <line x1="271" y1="168" x2="289" y2="162"/>
    <line x1="271" y1="177" x2="289" y2="171"/>
    <line x1="271" y1="186" x2="289" y2="180"/>
    <line x1="271" y1="195" x2="289" y2="189"/>
  </g>
