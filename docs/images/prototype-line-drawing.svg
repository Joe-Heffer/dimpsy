<svg xmlns="http://www.w3.org/2000/svg" width="760" height="784" viewBox="0 0 380 392" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Dimpsy prototype line drawing</title>
  <desc>Line drawing of an IKEA Fado globe lamp with an LED strip wound round an aluminium tube inside, connected by a cable through a screw terminal, which also takes a power adapter, to a bedside console box with two knobs, a toggle switch and a large snooze button on its top. Not to scale.</desc>
