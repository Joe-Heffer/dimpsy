# Folder-level licensing for files that cannot carry an SPDX header,
# such as KiCad, CAD and STL files. A header inside a file takes precedence.
version = 1

[[annotations]]
path = "firmware/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Joe Heffer"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "hardware/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Joe Heffer"
SPDX-License-Identifier = "CERN-OHL-P-2.0"

[[annotations]]
path = "enclosure/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Joe Heffer"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "docs/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Joe Heffer"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [".editorconfig-checker.json", "release-please-config.json", ".release-please-manifest.json", "version.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Joe Heffer"
SPDX-License-Identifier = "CC0-1.0"
