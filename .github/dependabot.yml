version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: docs

  # ESPHome version used by CI (firmware/esphome/requirements.txt).
  - package-ecosystem: pip
    directory: /firmware/esphome
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
