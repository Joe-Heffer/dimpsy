name: Task
description: A piece of work for the project board
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware
        - Hardware
        - Enclosure
        - Documentation
        - Research
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What needs doing
      description: Include what “done” looks like.
    validations:
      required: true
