# Builds the website from docs/ with MkDocs and publishes it to GitHub Pages.
# Pull requests build the site to check it but do not publish it.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Build
        run: mkdocs build --strict
      # The flash page (docs/flash.md) installs this binary with ESP Web Tools.
      # Pull requests skip it: the CI workflow already compiles the firmware.
      - name: Build web firmware
        if: github.event_name != 'pull_request'
        working-directory: firmware/esphome
        run: |
          pip install esphome
          cp secrets.yaml.example secrets.yaml
          esphome compile dimpsy-web.yaml
          cp .esphome/build/dimpsy/.pioenvs/dimpsy/firmware.factory.bin ../../site/firmware/dimpsy.factory.bin
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
