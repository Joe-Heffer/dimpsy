name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Skipped jobs count as passing for required checks, so the firmware jobs
  # can be required without blocking documentation-only pull requests.
  changes:
    name: Detect firmware changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare with base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          # Manual runs, new branches and unknown history build everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # docs/tools/brightness.js is checked against the C++ curves.
          if git diff --name-only "$base" HEAD -- \
              firmware/esphome firmware/core docs/tools/brightness.js \
              .github/workflows/ci.yml | grep -q .; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          else
            echo "No firmware changes; skipping firmware jobs."
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    name: Build firmware
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('firmware/esphome/dimpsy.yaml', 'firmware/esphome/requirements.txt') }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install -r firmware/esphome/requirements.txt
      - name: Create placeholder secrets
        working-directory: firmware/esphome
        run: cp secrets.yaml.example secrets.yaml
      - name: Build
        working-directory: firmware/esphome
        run: esphome compile dimpsy.yaml

  core-tests:
    name: Firmware core tests
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: make -C firmware/core test
      - name: Browser port matches the C++ curves
        run: make -C firmware/core --no-print-directory -s csv | node firmware/core/test/curves_parity.js
      - name: Curve summary
        run: make -C firmware/core --no-print-directory -s summary >> "$GITHUB_STEP_SUMMARY"

  # Undefined behaviour in the curve maths can pass the tests on x86 and
  # still misbehave on the ESP32, so build with sanitisers under both compilers.
  core-sanitisers:
    name: Firmware core sanitisers (${{ matrix.compiler }})
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
      CXXFLAGS: >-
        -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Wshadow -Werror
        -fsanitize=address,undefined -fno-sanitize-recover=all
        -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: make -C firmware/core test
      - name: Curve tool
        run: make -C firmware/core --no-print-directory -s csv > /dev/null

  esphome:
    name: Validate ESPHome config
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find ESPHome configs
        id: find
        run: |
          shopt -s nullglob
          found=false
          for f in firmware/esphome/*.yaml; do
            [ "$(basename "$f")" = "secrets.yaml" ] || found=true
          done
          if [ "$found" = false ]; then
            echo "No ESPHome configs in firmware/esphome; skipping."
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.find.outputs.found == 'true'
        with:
          python-version: "3.12"
      - name: Install ESPHome
        if: steps.find.outputs.found == 'true'
        run: pip install -r firmware/esphome/requirements.txt
      - name: Validate
        if: steps.find.outputs.found == 'true'
        working-directory: firmware/esphome
        run: |
          shopt -s nullglob
          [ -f secrets.yaml ] || cp secrets.yaml.example secrets.yaml
          for f in *.yaml; do
            [ "$f" = "secrets.yaml" ] || esphome config "$f"
          done
