name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v5

  firmware:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('firmware/dimpsy.yaml') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install --upgrade esphome
      - name: Create placeholder secrets
        working-directory: firmware
        run: cp secrets.example.yaml secrets.yaml
      - name: Validate configuration
        working-directory: firmware
        run: esphome config dimpsy.yaml
      - name: Build
        working-directory: firmware
        run: esphome compile dimpsy.yaml
