#
# SPDX-License-Identifier: CC0-1.0

# Website built with Material for MkDocs and published to GitHub Pages by
# .github/workflows/pages.yml. Preview locally with:
#
#   pip install -r requirements-docs.txt
#   mkdocs serve

site_name: Dimpsy
site_description: An open source bedside sleep light with a gentle sunrise alarm and dawn and dusk modes.
site_author: Joe Heffer
site_url: https://joe-heffer.github.io/dimpsy/
repo_url: https://github.com/Joe-Heffer/dimpsy
repo_name: Joe-Heffer/dimpsy
edit_uri: edit/main/docs/
copyright: Text CC-BY-4.0, code MIT, hardware CERN-OHL-P-2.0

docs_dir: docs
exclude_docs: |
  hooks/
  /README.md

theme:
  name: material
  language: en
  logo: assets/logo/dimpsy-mark-dark.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight

extra_css:
  - assets/site.css

plugins:
  - search:
      lang: en
  - include-markdown

hooks:
  - docs/hooks/links.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - About:
      - Design principles: design-principles.md
      - Requirements: requirements.md
      - Roadmap: roadmap.md
      - Licensing: licensing.md
  - Prototype:
      - Alpha build: alpha.md
      - First prototype: prototype.md
      - Safety: safety.md
      - Firmware: reference/firmware.md
      - Flash from your browser: flash.md
      - Hardware: reference/hardware.md
      - Hardware practices: hardware-practices.md
      - Enclosure: reference/enclosure.md
  - Decisions:
      - decisions/README.md
      - 0001 Record decisions: decisions/0001-record-decisions.md
      - 0002 Licensing: decisions/0002-licensing.md
      - 0003 USB-C power only: decisions/0003-usb-c-power-only.md
      - 0004 Firmware platform: decisions/0004-prototype-firmware-platform.md
      - 0005 Lamp body: decisions/0005-lamp-body.md
      - 0006 LED candidate: decisions/0006-led-candidate.md
      - 0007 Microcontroller board: decisions/0007-microcontroller-board.md
      - 0008 Reuse from other projects: decisions/0008-reuse-from-other-projects.md
      - 0009 Alpha build: decisions/0009-alpha-build.md
      - Decision template: decisions/template.md
  - Developers:
      - Developer tools: developers.md
      - Curve explorer: tools/curves.md
      - Contributing: contributing.md
      - Changelog: changelog.md
