# The firmware boots and starts ESPHome. It must do so with no reachable
# Wi-Fi network, because the lamp works without one.
name: Boots without Wi-Fi
version: 1
steps:
  - wait-serial: "ESPHome version"
  - wait-serial: "setup()"
