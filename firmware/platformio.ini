; PlatformIO project configuration for the Dimpsy firmware.
; https://docs.platformio.org/page/projectconf.html
;
; The board below is the generic Espressif ESP32-C3 development board. It is a
; placeholder so the project compiles, not a decision about the final hardware.

[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = platformio/espressif32@^6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
