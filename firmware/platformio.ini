; PlatformIO project configuration for the Dimpsy firmware.
; https://docs.platformio.org/page/projectconf.html
;
; The first prototype (proto-1) uses an ESP32 DevKitC (ESP32-WROOM-32 module).
; See docs/decisions/0007-microcontroller-board.md. The board for the finished
; lamp is not yet decided.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@^6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
